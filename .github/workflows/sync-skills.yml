name: Sync skills from upstream
run-name: "Sync skills from upstream (ref: ${{ inputs.ref || 'main' }})"

# Manual-only sync of the .agents/skills mirror from mattpocock/skills.
# Run it from the Actions tab; pass a tag (for example v1.2.3) to sync a
# pinned release, or leave the input empty to sync the tip of main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag or branch of mattpocock/skills to sync"
        required: false
        default: main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REF: ${{ inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Clone upstream at the requested ref
        run: |
          git clone --depth 1 --branch "$UPSTREAM_REF" \
            https://github.com/mattpocock/skills.git "$RUNNER_TEMP/upstream"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/upstream" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Resolve the tag pointing at the synced commit, if any, so the
          # version is recorded even when the input was a branch name.
          git -C "$RUNNER_TEMP/upstream" fetch --tags --depth 1 origin >/dev/null 2>&1 || true
          echo "UPSTREAM_TAG=$(git -C "$RUNNER_TEMP/upstream" tag --points-at HEAD | tail -n 1)" >> "$GITHUB_ENV"

      - name: Regenerate the .agents/skills mirror
        run: ./scripts/sync-agents-skills.sh "$RUNNER_TEMP/upstream"

      - name: Record the synced upstream version
        run: |
          printf 'ref: %s\ntag: %s\ncommit: %s\n' \
            "$UPSTREAM_REF" "${UPSTREAM_TAG:-none}" "$UPSTREAM_SHA" > .agents/UPSTREAM_VERSION

      - name: Commit and push if the mirror changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents
          added=$(git diff --cached --name-status | grep -c '^A' || true)
          updated=$(git diff --cached --name-status | grep -c '^M' || true)
          removed=$(git diff --cached --name-status | grep -c '^D' || true)
          source="mattpocock/skills (ref $UPSTREAM_REF, tag ${UPSTREAM_TAG:-none}, commit $UPSTREAM_SHA)"
          {
            echo "## Skills sync"
            echo ""
            echo "- Requested ref: \`$UPSTREAM_REF\`"
            echo "- Resolved tag: \`${UPSTREAM_TAG:-none}\`"
            echo "- Upstream commit: \`$UPSTREAM_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --cached --quiet; then
            echo "- Mirror already up to date; nothing committed." >> "$GITHUB_STEP_SUMMARY"
            echo "Mirror already matches $source; nothing to commit."
          else
            echo "- Files: $added added, $updated updated, $removed removed" >> "$GITHUB_STEP_SUMMARY"
            git commit -m "Sync .agents/skills from $source"
            git push
            echo "Synced $source: $added added, $updated updated, $removed removed."
          fi
